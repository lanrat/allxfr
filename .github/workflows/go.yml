name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Get dependencies
        run: make deps

      - name: Run tests
        run: make test

      - name: Build
        run: make

  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-latest
    steps:
      # go-version-file is deliberately omitted: the action defaults to
      # go-version 'stable' and that input wins when both are set (it warns and
      # ignores the file), so passing go.mod here would be a no-op. Scanning
      # against the latest patched Go is what we want anyway.
      - id: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-package: ./...
